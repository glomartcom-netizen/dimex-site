<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clean Wallet Test</title>

<style>
body{
  background:#000;
  color:#fff;
  font-family:Arial;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  height:100vh;
}
button{
  padding:15px 30px;
  background:gold;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}
#wallet{
  margin-top:20px;
  color:gold;
}
</style>
</head>

<body>

<h2>Clean Wallet Connect Test</h2>
<button id="connectBtn">Connect Wallet</button>
<div id="wallet"></div>

<script>

document.getElementById("connectBtn").addEventListener("click", async () => {

  try {

    if (!window.ethereum) {
      alert("No wallet injected.\nOpen inside MetaMask / Trust Wallet browser.");
      return;
    }

    // Request accounts
    const accounts = await window.ethereum.request({
      method: "eth_requestAccounts"
    });

    // Get chain
    const chainId = await window.ethereum.request({
      method: "eth_chainId"
    });

    document.getElementById("wallet").innerHTML =
      "Connected:<br>" + accounts[0] +
      "<br>Chain ID: " + parseInt(chainId, 16);

  } catch (err) {
    alert("Error: " + err.message);
    console.log(err);
  }

});

</script>

</body>
</html>
