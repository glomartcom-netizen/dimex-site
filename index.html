<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Universal Wallet Connect</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js"></script>
<script src="https://unpkg.com/@walletconnect/ethereum-provider@2.11.0/dist/index.umd.js"></script>
<style>
body{
  background:#000;
  color:#fff;
  font-family:Arial;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  height:100vh;
}

button{
  padding:15px 30px;
  background:gold;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
  margin:10px;
}

#wallet{
  margin-top:20px;
  color:gold;
  text-align:center;
}
</style>
</head>

<body>

<h2>Universal Wallet Connect</h2>

<button onclick="connectWallet()">Connect Wallet</button>

<div id="wallet"></div>

<script>

let provider;

async function connectWallet(){
async function connectWallet(){

  try{

    // Injected (Desktop / MetaMask browser)
    if(window.ethereum){
      provider = new ethers.providers.Web3Provider(window.ethereum);
      await provider.send("eth_requestAccounts", []);
    }

    // WalletConnect v2 fallback
    else{

      const wcProvider = await EthereumProvider.init({
        projectId: "059cc242b0cc96ac9665c598b76ddc7b",
        chains: [56],
        showQrModal: true
      });

      await wcProvider.connect();

      provider = new ethers.providers.Web3Provider(wcProvider);
    }

    const signer = provider.getSigner();
    const address = await signer.getAddress();
    const network = await provider.getNetwork();

    document.getElementById("wallet").innerHTML =
      "Connected:<br>" + address +
      "<br>Chain ID: " + network.chainId;

  }catch(e){
    console.log(e);
    alert("Connection Failed: " + e.message);
  }
}
<script>
</body>
</html>
